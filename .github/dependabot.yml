---
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 5
    commit-message:
      prefix: ci
      include: scope
    groups:
      all:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      all:
        patterns: ["*"]
    ignore:
      # @types/node must track the Node major this action actually runs on
      # (`using: node24` in action.yml, .node-version, and the esbuild target).
      # A newer major would let tsc accept APIs that do not exist at runtime, so
      # major bumps are deliberate and happen together with the runtime bump.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
