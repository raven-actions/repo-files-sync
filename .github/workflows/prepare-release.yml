# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
---
name: Prepare Release

# Manually-triggered workflow that opens the final-release pull request.
#
# It computes the next stable version and the FULL release notes since the last
# final release, updates CHANGELOG.md, and opens a PR titled
# `chore(release): vX.Y.Z`. Merging that PR triggers publish-release.yml, which tags the
# final release at the exact commit of the last release candidate (see the
# `prerelease/vX.Y.Z` branch). Cut at least one RC (merge to main) before running.

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # create the release-prep branch + verified changelog commit
      pull-requests: write # open/update the release PR
      actions: write # dispatch CI against the release branch (see the last step)
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve published source baseline
        id: history
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { default: script } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/release-history.mjs`)
            await script({ context, github, core })

      - name: Install git-cliff and preview source changes
        uses: orhun/git-cliff-action@3d96a18cc4ec17e9dc69ddcc424ccafaf1f78ce2 # v4.9.0
        with:
          version: v2.14.1
          config: .github/cliff.toml
          args: --github-repo "${{ github.repository }}" --tag-pattern '^$' --strip all "${{ steps.history.outputs.range }}"
        env:
          OUTPUT: git-cliff/source-preview.md
          GITHUB_TOKEN: ${{ github.token }}

      - name: Compute version, full notes and CHANGELOG.md
        id: notes
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { default: script } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/release-notes.mjs`)
            await script({ context, core })
        env:
          INPUT_MODE: stable
          INPUT_HISTORY: ${{ steps.history.outputs.history }}
          INPUT_CLI_PATH: ${{ runner.temp }}/git-cliff/bin/git-cliff
          GITHUB_TOKEN: ${{ github.token }}

      - name: Verify release artifact branch is orphaned
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { default: script } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/release-branch-assert-orphan.mjs`)
            await script({ context, github, core })
        env:
          INPUT_BRANCH: prerelease/${{ steps.notes.outputs.version }}
          INPUT_BASE_BRANCH: ${{ github.event.repository.default_branch }}
          INPUT_EXPECTED_SHA: ${{ steps.notes.outputs.candidate_sha }}

      # The final release must reuse the latest PUBLISHED RC. A draft RC updates
      # the prerelease/<version> branch before it creates a git tag, so require
      # the branch tip to match the latest promoted vX.Y.Z-rc.N tag.
      - name: Verify a published release candidate exists
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.notes.outputs.version }}
          RC_TAG: ${{ steps.notes.outputs.candidate_tag }}
          RC_SHA: ${{ steps.notes.outputs.candidate_sha }}
        run: |
          branch_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/refs/heads/prerelease/${VERSION}" --jq '.object.sha' 2>/dev/null || true)"
          if [ -z "${branch_sha}" ]; then
            echo "::error::No release candidate branch prerelease/${VERSION}. Merge changes to main and let an RC build first."
            exit 1
          fi
          if [ "${branch_sha}" != "${RC_SHA}" ]; then
            echo "::error::prerelease/${VERSION} points at ${branch_sha}, but latest published RC ${RC_TAG} points at ${RC_SHA}. Publish the current draft RC before preparing the final release."
            exit 1
          fi
          echo "Published release candidate ${RC_TAG} found at branch tip ${branch_sha}."

      # Pin the action version in the README usage examples to the version being
      # released, so the docs rendered from the default branch always match the
      # just-published tag. Only references to THIS action are rewritten (the
      # pattern is keyed to the repo slug), and the value equals the release tag
      # exactly. git-cliff cannot edit arbitrary files, so this is a plain sed.
      - name: Pin action version in README
        env:
          VERSION: ${{ steps.notes.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          # Escape regex metacharacters in the repo slug before using it in the
          # sed pattern, so a slug with '.', '+', etc. is matched literally
          # (mirrors the escaping the .mjs release scripts already do).
          esc_repo="$(printf '%s' "${REPO}" | sed 's#[^A-Za-z0-9_/-]#\\&#g')"
          sed -i -E "s#(${esc_repo}@)v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?#\1${VERSION}#g" README.md
          echo "README now pins ${REPO}@${VERSION}:"
          grep -n "${REPO}@" README.md || true

      - name: Open release PR
        id: pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { default: script } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/release-pr-create.mjs`)
            await script({ context, github, core })
        env:
          INPUT_VERSION: ${{ steps.notes.outputs.version }}
          INPUT_NOTES: ${{ steps.notes.outputs.content }}
          INPUT_FILES: |
            CHANGELOG.md
            README.md
          INPUT_BRANCH_PREFIX: release-prep

      # The release PR is opened with GITHUB_TOKEN, and GitHub deliberately does
      # not start `pull_request` workflow runs for token-created PRs - so the
      # required Lint / Build / Type Check / Test Check contexts would never
      # appear and the PR could only be merged by bypassing the ruleset.
      # `workflow_dispatch` is the documented exception that GITHUB_TOKEN *is*
      # allowed to trigger, and a dispatched run's check runs attach to the head
      # commit of the release branch - which is exactly the PR's head commit - so
      # they satisfy the required status checks.
      - name: Run CI on the release branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.pr.outputs.branch }}
        run: |
          gh workflow run ci.yml --ref "${BRANCH}"
          echo "Dispatched CI on ${BRANCH}; its checks report on the release PR."

      - name: Summary
        env:
          VERSION: ${{ steps.notes.outputs.version }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          {
            echo "## Release prepared"
            echo ""
            echo "- Version: \`${VERSION}\`"
            echo "- Release PR: ${PR_URL}"
            echo ""
            echo "Merge the PR to publish the final release at the last RC commit."
          } >> "$GITHUB_STEP_SUMMARY"
