---
allowBuilds:
  esbuild: true

overrides:
  # Deduplicates the two @actions/http-client majors onto a single undici.
  # Keep at or above 6.28.0: earlier 6.x releases carry GHSA-m8rv-5g2x-5cg5,
  # GHSA-v3r7-h72x-cjcm and GHSA-8xcm-r25x-g524.
  undici: 6.28.0

# Delay adopting just-published versions to avoid pulling in broken or yanked
# releases during install/update (including `pnpm up --latest`).
# Value is in minutes; 4320 = 3 days.
minimumReleaseAge: 4320
